<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pfennig · Buchungen</title>
  <style>
    :root { color-scheme: light; --ink:#202124; --muted:#73767b; --hair:#e6e6e4; --paper:#fff; --canvas:#f5f5f3; --blue:#3568c8; --green:#257348; --green-tint:#edf7f0; --yellow:#936b09; --yellow-tint:#fff8df; --red:#b43e38; --red-tint:#fff0ef; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:980px; background:var(--canvas); color:var(--ink); font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif; }
    button,input { font:inherit; }
    .window { height:calc(100vh - 40px); margin:20px; overflow:hidden; background:var(--paper); border:1px solid #d9d9d6; border-radius:10px; box-shadow:0 9px 28px rgba(0,0,0,.07); display:flex; flex-direction:column; }
    .toolbar { height:56px; flex:none; display:flex; align-items:center; gap:18px; padding:0 18px; border-bottom:1px solid var(--hair); background:rgba(252,252,251,.96); }
    .traffic { display:flex; gap:7px; width:48px; }
    .traffic i { display:block; width:10px; height:10px; border-radius:50%; background:#d8d8d5; }
    .wordmark { font-size:15px; font-weight:650; letter-spacing:-.2px; }
    .segments { display:flex; gap:2px; margin-left:20px; padding:2px; border:1px solid #dededb; border-radius:7px; background:#f2f2f0; }
    .segments button { border:0; padding:5px 12px; border-radius:5px; color:#666; background:transparent; cursor:pointer; }
    .segments button.active { color:#202124; background:white; box-shadow:0 1px 3px rgba(0,0,0,.13); font-weight:600; }
    .toolbar-spacer { flex:1; }
    .search { width:190px; display:flex; align-items:center; gap:7px; color:#888; padding:6px 9px; border:1px solid #dededb; border-radius:6px; background:#fff; }
    .search svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; }
    .search input { width:100%; border:0; outline:0; color:var(--ink); background:transparent; }
    .inspector-toggle { border:0; background:transparent; color:#555; padding:6px; cursor:pointer; }
    .content { flex:1; min-height:0; display:flex; }
    .ledger { min-width:0; flex:1; min-height:0; padding:18px 20px 0; display:flex; flex-direction:column; }
    .table-scroll { min-height:0; flex:1; overflow:auto; }
    thead th { position:sticky; top:0; z-index:1; background:var(--paper); }
    .subbar { height:30px; display:flex; align-items:flex-start; color:var(--muted); }
    .filters { display:flex; gap:5px; }
    .filters button { border:0; padding:3px 8px; color:#777; border-radius:5px; background:transparent; cursor:pointer; }
    .filters button.active { color:#333; background:#f0f0ee; font-weight:600; }
    .count { margin-left:auto; font-size:12px; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; }
    th { height:31px; text-align:left; color:#858585; font-size:11px; font-weight:500; border-bottom:1px solid var(--hair); }
    th:nth-child(1){width:44%} th:nth-child(2){width:15%} th:nth-child(3){width:15%;text-align:right;padding-right:16px} th:nth-child(4){width:13%} th:nth-child(5){width:13%}
    td { height:56px; padding:7px 8px 7px 0; vertical-align:middle; border-bottom:1px solid #eeeeec; }
    tbody tr { cursor:pointer; }
    tbody tr:hover { background:#fafafa; }
    tbody tr.selected { background:#f4f7fc; }
    .company { display:flex; align-items:center; gap:10px; min-width:0; }
    .cat-icon { flex:none; width:32px; height:32px; display:grid; place-items:center; border:1px solid #e2e2df; border-radius:8px; color:#62656a; background:#fafaf9; }
    .cat-icon svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
    .company-text { min-width:0; }
    .company-name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .title { margin-top:2px; color:#85868a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .date { color:#66686c; }
    .amount { text-align:right; font-variant-numeric:tabular-nums; font-weight:550; }
    .amount.income { color:var(--green); }
    .payment { color:#63666a; white-space:nowrap; }
    .empty-row { height:120px; color:#909196; text-align:center; }
    .payment svg { width:13px; height:13px; vertical-align:-2px; margin-right:4px; stroke:currentColor; fill:none; stroke-width:1.6; }
    .badge { display:inline-flex; align-items:center; gap:5px; padding:4px 7px; border-radius:5px; font-size:11px; white-space:nowrap; }
    .badge svg { width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .badge.ok { color:var(--green); background:var(--green-tint); } .badge.check { color:var(--yellow); background:var(--yellow-tint); } .badge.missing { color:var(--red); background:var(--red-tint); }
    .ledger-footer { margin-top:auto; min-height:48px; display:flex; align-items:center; gap:25px; color:#777; border-top:1px solid var(--hair); font-size:12px; }
    .ledger-footer strong { color:#303134; font-weight:600; margin-left:4px; font-variant-numeric:tabular-nums; }
    .ledger-footer .saldo { color:#343638; }
    .inspector { flex:none; width:340px; overflow:auto; padding:20px 20px 24px; border-left:1px solid var(--hair); background:#fafaf9; }
    .inspector h2 { margin:0; font-size:18px; letter-spacing:-.2px; }
    .inspector .subtle { color:var(--muted); font-size:12px; }
    .section { padding:18px 0; border-bottom:1px solid var(--hair); }
    .section:first-of-type { padding-top:15px; }
    .section h3 { margin:0 0 10px; color:#777; font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.06em; }
    .receipt { height:145px; padding:16px; border:1px solid #dcdcd8; border-radius:6px; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.04); transform:rotate(-.4deg); }
    .receipt .paper-title { font:600 11px Georgia,serif; text-align:center; } .receipt hr { border:0; border-top:1px dashed #cfcfca; margin:10px 0; }
    .receipt p { margin:5px 0; color:#777; font:10px Georgia,serif; } .receipt p:last-child { text-align:right; color:#333; font-weight:bold; }
    .detail { display:grid; grid-template-columns:100px 1fr; gap:7px 10px; }
    .detail dt { color:#888; } .detail dd { margin:0; color:#333; font-weight:500; }
    .note { color:#67686b; font-size:12px; }
    .confirm { width:100%; padding:8px 10px; color:white; border:0; border-radius:6px; background:#3568c8; cursor:pointer; font-weight:600; }
    .confirm:hover { background:#2f5eb7; }
    button:focus-visible, input:focus-visible, tr:focus-visible { outline:2px solid #6e9be8; outline-offset:2px; }
    .content.inspector-hidden .inspector { display:none; }
    .footer-note { padding:9px 20px; color:#999; font-size:11px; text-align:right; border-top:1px solid var(--hair); }
    @media (max-width:1100px) { .window { margin:10px; height:calc(100vh - 20px); } .inspector { width:310px; } .search { width:150px; } }
  </style>
</head>
<body>
  <div class="window">
    <header class="toolbar">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="wordmark">Pfennig</div>
      <nav class="segments" aria-label="Richtung"><button class="active" data-direction="all">Alle</button><button data-direction="income">Einnahmen</button><button data-direction="expense">Ausgaben</button></nav>
      <div class="toolbar-spacer"></div>
      <label class="search"><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><input id="search" type="search" placeholder="Suchen" aria-label="Buchungen suchen"></label>
      <button class="inspector-toggle" id="inspectorToggle" aria-label="Inspector ausblenden" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M12 3v14"/></svg></button>
    </header>
    <main class="content" id="content">
      <section class="ledger">
        <div class="subbar"><div class="filters"><button class="active" data-review="all">Alle</button><button data-review="check">Zu prüfen</button><button data-review="missing">Ohne Beleg</button></div><div class="count" id="count"></div></div>
        <div class="table-scroll"><table><thead><tr><th>Firma</th><th>Datum</th><th>Betrag</th><th>Bezahlt</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
        <footer class="ledger-footer"><span>Einnahmen <strong id="incomeTotal">0,00 €</strong></span><span>Ausgaben <strong id="expenseTotal">0,00 €</strong></span><span class="saldo">Saldo <strong id="balanceTotal">0,00 €</strong></span></footer>
      </section>
      <aside class="inspector" id="inspector"></aside>
    </main>
    <div class="footer-note">Demo · Fiktive Buchungen</div>
  </div>
<script>
  // Icons approximate SF Symbols, not Apple assets. Future SwiftUI implementation can use Image(systemName:).
  const icons={meal:'<path d="M5 3v6M3.5 3v4.5a1.5 1.5 0 0 0 3 0V3M5 8v9M13 3v14M13 3c2 1.3 2.3 4.4 0 5.8"/>',travel:'<path d="m3 12 14-6-3 14-3.5-6.5L3 12Z"/><path d="m10.5 13.5-3 3"/>',computer:'<rect x="3" y="4" width="14" height="10" rx="1.5"/><path d="M7 17h6M10 14v3"/>',phone:'<rect x="6" y="2.5" width="8" height="15" rx="1.7"/><path d="M9 15h2"/>',cloud:'<path d="M5.5 15.5h9a3 3 0 0 0 .3-6A4.5 4.5 0 0 0 6 8.7a3.4 3.4 0 0 0-.5 6.8Z"/>',office:'<path d="M4 17V5l8-2v14M12 7h4v10M7 7h2M7 10h2M7 13h2M14 10h1M14 13h1"/>',book:'<path d="M4 4.5A2 2 0 0 1 6 3h10v14H6a2 2 0 0 1-2-2V4.5Z"/><path d="M4 14.5a2 2 0 0 1 2-2h10"/>',shirt:'<path d="m7 4 3 2 3-2 3 3-2 2v8H6V9L4 7l3-3Z"/>',tools:'<path d="m12 4 4 4M13 3a3 3 0 0 0-3.8 3.8L3 13l1.5 1.5 6.2-6.2A3 3 0 0 0 14.5 5L12 7.5"/>'};
  const data=[
    {id:1,dir:'expense',icon:'computer',company:'Nordlicht Bürobedarf',title:'Monitor und Dockingstation',date:'12.06.2026',amount:-42800,payment:'paid',status:'check',receipt:'Rechnung_Nordlicht.pdf',category:'Bürobedarf',tax:'19 %',note:'Beleg vorhanden, Zuordnung bitte prüfen.'},
    {id:2,dir:'expense',icon:'cloud',company:'Wolkenwerk Hosting',title:'Server und Speicher · Juni',date:'08.06.2026',amount:-5980,payment:'paid',status:'ok',receipt:'Wolkenwerk_06.pdf',category:'Telefon / Internet',tax:'19 %'},
    {id:3,dir:'income',icon:'office',company:'Klarraum Studio',title:'Projektphase 2 · Interface',date:'03.06.2026',amount:245000,payment:'open',status:'ok',receipt:'Rechnung_Klarraum.pdf',category:'Betriebseinnahmen',tax:'19 %'},
    {id:4,dir:'expense',icon:'travel',company:'Hafenblick Bahn',title:'Fahrt zum Kundentermin',date:'29.05.2026',amount:-8740,payment:'paid',status:'ok',receipt:'Bahn_2905.pdf',category:'Reisekosten',tax:'19 %'},
    {id:5,dir:'expense',icon:'meal',company:'Tisch 17',title:'Arbeitsessen mit Kundin',date:'24.05.2026',amount:-6720,payment:'partial',status:'missing',receipt:'',category:'Bewirtung',tax:'19 %',note:'Originalbeleg fehlt.'},
    {id:6,dir:'income',icon:'book',company:'Atelier Hain',title:'Workshop · Mai',date:'18.05.2026',amount:98000,payment:'paid',status:'check',receipt:'Atelier_Hain.pdf',category:'Betriebseinnahmen',tax:'19 %'},
    {id:7,dir:'expense',icon:'phone',company:'Funkfeld Mobil',title:'Mobilfunk · Mai',date:'11.05.2026',amount:-2990,payment:'paid',status:'ok',receipt:'Funkfeld_Mai.pdf',category:'Telefon / Internet',tax:'19 %'},
    {id:8,dir:'expense',icon:'shirt',company:'Leinen & Form',title:'Arbeitskleidung',date:'02.05.2026',amount:-11900,payment:'open',status:'check',receipt:'Leinen_Form.pdf',category:'Arbeitsmittel',tax:'19 %'},
    {id:9,dir:'expense',icon:'tools',company:'Werkraum Service',title:'Reparatur Werkzeug',date:'26.04.2026',amount:-18600,payment:'paid',status:'ok',receipt:'Werkraum_Repair.pdf',category:'Arbeitsmittel',tax:'19 %'},
    {id:10,dir:'income',icon:'office',company:'Studio Morgen',title:'Konzeption und Beratung',date:'14.04.2026',amount:165000,payment:'paid',status:'ok',receipt:'Studio_Morgen.pdf',category:'Betriebseinnahmen',tax:'19 %'}
  ];
  let direction='all', review='all', selected=1;
  const euro=c=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(c/100);
  const icon=(name)=>'<svg viewBox="0 0 20 20">'+icons[name]+'</svg>';
  const paymentIcons={paid:'<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><path d="m6.5 10 2.2 2.2 4.8-5"/></svg>',partial:'<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5v6.5h6.5"/></svg>',open:'<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/></svg>'};
  function statusBadge(s){let labels={ok:'Geprüft',check:'Zu prüfen',missing:'Beleg fehlt'}, cls={ok:'ok',check:'check',missing:'missing'};let mark=s==='ok'?'<path d="m3 7 2.5 2.5L9 5"/>':s==='check'?'<circle cx="6" cy="7" r="3"/><path d="M6 5.5v2M6 9.5v.1"/>':'<path d="M4 4l8 8M12 4l-8 8"/>';return `<span class="badge ${cls[s]}"><svg viewBox="0 0 14 14">${mark}</svg>${labels[s]}</span>`;}
  function payment(p){return paymentIcons[p]+({paid:'Bezahlt',partial:'Teilbezahlt',open:'Offen'}[p]);}
  function render(){let q=document.querySelector('#search').value.toLowerCase();let visible=data.filter(x=>(direction==='all'||x.dir===direction)&&(review==='all'||(review==='check'&&x.status==='check')||(review==='missing'&&x.status==='missing'))&&(!q||`${x.company} ${x.title} ${x.category}`.toLowerCase().includes(q)));if(visible.length){if(!visible.some(x=>x.id===selected))selected=visible[0].id;}else{selected=null;}document.querySelector('#count').textContent=`${visible.length} ${visible.length===1?'Buchung':'Buchungen'}`;document.querySelector('#rows').innerHTML=visible.length?visible.map(x=>`<tr class="${x.id===selected?'selected':''}" data-id="${x.id}" tabindex="0" aria-selected="${x.id===selected}"><td><div class="company"><span class="cat-icon">${icon(x.icon)}</span><div class="company-text"><div class="company-name">${x.company}</div><div class="title">${x.title}</div></div></div></td><td class="date">${x.date}</td><td class="amount ${x.dir==='income'?'income':''}">${euro(x.amount)}</td><td class="payment">${payment(x.payment)}</td><td>${statusBadge(x.status)}</td></tr>`).join(''):'<tr><td class="empty-row" colspan="5">Keine Buchungen für diese Auswahl.</td></tr>';document.querySelectorAll('tr[data-id]').forEach(r=>{const select=()=>{selected=+r.dataset.id;renderInspector();render()};r.onclick=select;r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}}});let inc=visible.filter(x=>x.dir==='income').reduce((a,x)=>a+x.amount,0), exp=visible.filter(x=>x.dir==='expense').reduce((a,x)=>a+x.amount,0);document.querySelector('#incomeTotal').textContent=euro(inc);document.querySelector('#expenseTotal').textContent=euro(Math.abs(exp));document.querySelector('#balanceTotal').textContent=euro(inc+exp);renderInspector();}
  function renderInspector(){let x=data.find(x=>x.id===selected);if(!x){document.querySelector('#inspector').innerHTML='<h2>Beleg</h2><div class="subtle" style="margin-top:12px">Keine Buchung gefunden.</div>';return;}document.querySelector('#inspector').innerHTML=`<h2>Beleg</h2><div class="subtle">${x.status==='check'?'Ungeprüfte Buchung':'Buchung'} · ${x.date}</div><div class="section"><h3>Vorschau</h3>${x.receipt?`<div class="receipt"><div class="paper-title">${x.company.toUpperCase()}</div><hr><p>Rechnung · ${x.date}</p><p>${x.title}</p><hr><p>${euro(Math.abs(x.amount))}</p></div><div class="subtle" style="margin-top:9px">${x.receipt}</div>`:'<div class="subtle">Kein Beleg zu dieser Buchung.</div>'}</div><div class="section"><h3>Grunddaten</h3><dl class="detail"><dt>Firma</dt><dd>${x.company}</dd><dt>Titel</dt><dd>${x.title}</dd><dt>Kategorie</dt><dd>${x.category}</dd><dt>Datum</dt><dd>${x.date}</dd><dt>Betrag</dt><dd>${euro(x.amount)}</dd><dt>Richtung</dt><dd>${x.dir==='income'?'Einnahme':'Ausgabe'}</dd></dl></div><div class="section"><h3>Zahlung und Prüfung</h3><dl class="detail"><dt>Zahlungsstand</dt><dd>${({paid:'Bezahlt',partial:'Teilbezahlt',open:'Offen'}[x.payment])}</dd><dt>Prüfstatus</dt><dd>${x.status==='ok'?'Geprüft':x.status==='missing'?'Beleg fehlt':'Zu prüfen'}</dd></dl></div><div class="section"><h3>Steuer</h3><dl class="detail"><dt>Behandlung</dt><dd>Inland</dd><dt>Steuersatz</dt><dd>${x.tax}</dd></dl></div>${x.note?`<div class="section"><h3>Notizen</h3><div class="note">${x.note}</div></div>`:''}${x.status==='check'?'<div class="section"><button class="confirm" onclick="confirmBooking()">Bestätigen</button></div>':''}`;}
  function confirmBooking(){let x=data.find(x=>x.id===selected);x.status='ok';renderInspector();render();}
  document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>{direction=b.dataset.direction;document.querySelectorAll('[data-direction]').forEach(x=>x.classList.toggle('active',x===b));render()});
  document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{review=b.dataset.review;document.querySelectorAll('[data-review]').forEach(x=>x.classList.toggle('active',x===b));render()});
  document.querySelector('#search').oninput=render;
  document.querySelector('#inspectorToggle').onclick=()=>{const content=document.querySelector('#content');const hidden=content.classList.toggle('inspector-hidden');const button=document.querySelector('#inspectorToggle');button.setAttribute('aria-pressed',String(!hidden));button.setAttribute('aria-label',hidden?'Inspector anzeigen':'Inspector ausblenden');};
  renderInspector(); render();
</script>
</body>
</html>
