name: Pfennig
options:
  bundleIdPrefix: com.pietz
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: de
  groupSortPosition: top
  minimumXcodeGenVersion: "2.42"

fileGroups:
  - Package.swift
  - README.md
  - docs

packages:
  PfennigPackages:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.11.0"
    CURRENT_PROJECT_VERSION: "13"
    # The "Apple Development: ... (85S4HQKSU2)" certificate carries team
    # 34MWWCL4H2 in its OU; the number in its common name is the certificate's
    # own id, not a team. Signing Debug with it keeps the designated
    # requirement identical across rebuilds, which is what lets the Keychain
    # item stay readable without an access dialog.
    DEVELOPMENT_TEAM: 34MWWCL4H2
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES

targets:
  Pfennig:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: PfennigPackages
        product: Core
      - package: PfennigPackages
        product: Agent
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: Pfennig
        PRODUCT_BUNDLE_IDENTIFIER: com.pietz.pfennig
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Pfennig.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          PRODUCT_NAME: Pfennig Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.pietz.pfennig.dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev

schemes:
  Pfennig:
    build:
      targets:
        Pfennig: all
    run:
      config: Debug
    archive:
      config: Release
