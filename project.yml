name: Pfennig
options:
  bundleIdPrefix: com.pietz
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: de
  groupSortPosition: top
  minimumXcodeGenVersion: "2.42"

fileGroups:
  - Package.swift
  - README.md
  - docs

packages:
  PfennigPackages:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 34MWWCL4H2
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES

targets:
  Pfennig:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: PfennigPackages
        product: Domain
      - package: PfennigPackages
        product: Database
      - package: PfennigPackages
        product: DocumentStore
      - package: PfennigPackages
        product: AI
      - package: PfennigPackages
        product: ImportPipeline
      - package: PfennigPackages
        product: Analysis
    settings:
      base:
        PRODUCT_NAME: Pfennig
        PRODUCT_BUNDLE_IDENTIFIER: com.pietz.pfennig
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Pfennig.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

schemes:
  Pfennig:
    build:
      targets:
        Pfennig: all
    run:
      config: Debug
    archive:
      config: Release
